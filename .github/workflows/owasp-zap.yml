name: CI Pipeline (Test, Build & Security)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ---------------------------------------------------
  # CAJA 1: TESTING
  # ---------------------------------------------------
  test:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Levantar Base de Datos para Tests
        run: |
          cd infraestructura
          docker compose up -d db
          sleep 15
          
      - name: Ejecutar Tests
        run: |
          cd backend
          mvn test

  # ---------------------------------------------------
  # CAJA 2: COMPILACIÓN (Depende de TEST)
  # ---------------------------------------------------
  build:
    name: 📦 Build Artifact (JAR)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Empaquetar el Proyecto
        run: |
          cd backend
          mvn package -DskipTests
          
      - name: Subir el JAR para el siguiente Job
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # ---------------------------------------------------
  # CAJA 3: ESCANEO OWASP ZAP (Depende de BUILD)
  # ---------------------------------------------------
  security_scan:
    name: 🛡️ OWASP ZAP Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Descargar el JAR de la etapa anterior
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      - name: Levantar Base de Datos (MySQL)
        run: |
          cd infraestructura
          docker compose up -d db
          sleep 15
          
      - name: Iniciar Backend desde el JAR compilado
        run: |
          cd backend/target
          nohup java -jar *.jar > backend.log 2>&1 &
          sleep 45

      - name: Configurar reglas de ZAP
        run: |
          mkdir -p .zap
          echo -e "90022\tIGNORE\t(Application Error Disclosure en Swagger)" > .zap/rules.tsv
          echo -e "10023\tIGNORE\t(Information Disclosure Debug Errors)" >> .zap/rules.tsv
          echo -e "10049\tIGNORE\t(Non-Storable Content en API)" >> .zap/rules.tsv
          echo -e "90005\tIGNORE\t(Sec-Fetch Headers Missing en API)" >> .zap/rules.tsv
          chmod -R 777 $GITHUB_WORKSPACE

      - name: Ejecutar OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080/v3/api-docs'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          artifact_name: '' 
          cmd_options: '-a'
          
      - name: Guardar Reporte de Seguridad HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZAP-Security-Report
          path: report_html.html