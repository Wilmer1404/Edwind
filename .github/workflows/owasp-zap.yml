name: CI Pipeline (Build, Test & Security)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_test_and_scan:
    runs-on: ubuntu-latest
    name: Build, Test & ZAP Scan
    
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Levantar Base de Datos (MySQL)
        run: |
          cd infraestructura
          docker compose up -d db
          sleep 15
          
      - name: Ejecutar Tests de Spring Boot
        run: |
          cd backend
          mvn test
          
      - name: Construir el Proyecto (Build JAR)
        run: |
          cd backend
          mvn package -DskipTests
          
      - name: Iniciar Backend Spring Boot en segundo plano
        run: |
          cd backend
          mvn spring-boot:run &
          sleep 45 

      - name: Configurar reglas de ZAP (Ignorar Falsos Positivos)
        run: |
          mkdir -p .zap
          echo -e "90022\tIGNORE\t(Application Error Disclosure en Swagger)" > .zap/rules.tsv
          echo -e "10023\tIGNORE\t(Information Disclosure Debug Errors)" >> .zap/rules.tsv
          echo -e "10049\tIGNORE\t(Non-Storable Content en API)" >> .zap/rules.tsv
          echo -e "90005\tIGNORE\t(Sec-Fetch Headers Missing en API)" >> .zap/rules.tsv
          chmod -R 777 $GITHUB_WORKSPACE

      - name: Ejecutar OWASP ZAP contra la instancia temporal
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080/v3/api-docs'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false 
          cmd_options: '-a'
          
      - name: Guardar Reporte de Seguridad HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZAP-Security-Report
          path: report_html.html
